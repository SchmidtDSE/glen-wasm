name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  vendor:
    name: Vendored files match their sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, version from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:vendor
      - run: pnpm run vendor:harness
      # --porcelain, so an untracked or deleted file fails too.
      - name: Fail if vendor/ is out of date
        run: |
          if [ -n "$(git status --porcelain -- vendor/)" ]; then
            git status --short -- vendor/
            echo "::error::vendor/ does not match its sources. Run 'pnpm run build:vendor' and 'pnpm run vendor:harness' and commit the result."
            exit 1
          fi

  e2e:
    name: In headless Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Needs no packages: Node's own fetch and WebSocket drive Chrome, which
      # the runner image includes. The page fetches DuckDB-wasm and the county
      # files over the network, as it does for users.
      - run: CHROME=$(command -v google-chrome) node scripts/e2e.mjs
